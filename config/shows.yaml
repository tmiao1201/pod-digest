# 订阅清单（watchlist）—— 你关注的播客往这里加
# 字段说明:
#   name:        显示名（也是 out/episodes/ 的目录名）
#   itunes_name: iTunes 搜索用名（英文播客填英文，默认同 name）
#   youtube:     可选，频道搜索名（有视频版则字幕优先，免转写）
#   rss:         可选，已知 feedUrl 直接填（省一次搜索）
#   lang:        可选，转写语言提示 zh/en/ja（默认 auto 自动检测）
#   tags:        自由标签（未来按主题筛 digest 用）
# 用法: `pod-digest --scan` 扫描此清单列出各节目最新一集；逐集 digest 时按 name 索引

shows:
  - name: 硅谷101
    youtube: "硅谷101播客"
    lang: zh
    tags: [科技, AI, 生物医药, 投资]

