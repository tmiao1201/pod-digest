# 订阅清单示例（公开仓库自带这份；你的私单写到 shows.local.yaml，不入库）
# 字段: name 必填 / lang 可选(zh|en|ja,默认auto,英文播客建议填) / youtube 可选(频道搜索词,填了优先字幕路径)
#       itunes_name 可选(搜索名,默认同name) / rss 可选(已知feed直链) / tags 自定义
shows:
  - name: 硅谷101
    youtube: "硅谷101播客"
    lang: zh
    tags: [科技, AI, 生物医药]
  - name: Acquired
    lang: en
    tags: [科技, 商业史]
  - name: 忽左忽右
    lang: zh
    tags: [人文, 访谈]
